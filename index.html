<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روز دختر مبارک ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at top, #2b1055, #120726, #090214);
      min-height: 100vh;
      font-family: 'Vazirmatn', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }
    .heart {
      position: fixed;
      bottom: -40px;
      color: rgba(255, 107, 129, 0.65);
      animation: floatUp linear forwards;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
    }
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 36px;
      padding: 24px 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.05);
      text-align: center;
    }
    .img-wrapper {
      position: relative;
      width: 100%;
      height: 290px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 5px 16px;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
    }
    h1 {
      margin-top: 12px;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #ffd6e0, #ff758f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .message {
      margin-top: 12px;
      font-size: 0.95rem;
      line-height: 1.85;
      color: rgba(255, 255, 255, 0.88);
      font-weight: 300;
      padding: 0 4px;
    }
    .player {
      margin-top: 22px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.45);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .play-btn:active {
      transform: scale(0.92);
    }
    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }
    .song-details {
      text-align: right;
      flex-grow: 1;
    }
    .song-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
    .song-subtitle {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }
    .disk {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #333 30%, #111 70%);
      border: 2px solid rgba(255, 77, 109, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotateDisk 4s linear infinite;
      animation-play-state: paused;
      flex-shrink: 0;
    }
    .disk.playing {
      animation-play-state: running;
    }
    @keyframes rotateDisk {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .disk span {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="img-wrapper">
      <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop" alt="Romantic Silhouette">
    </div>

    <div class="badge">🌹 فقط برای تو</div>
    <h1>روز دختر مبارک نفسم ✨</h1>
    
    <p class="message">
      کنار تو قشنگ‌ترین حس دنیارو تجربه می‌کنم... مرسی که با بودنت دنیامو رنگی‌تر کردی. روزت مبارک باشه زیباترین فرشته من! ❤️✨
    </p>

    <div class="player">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <div class="song-details">
        <div class="song-title">جانم باش 🎶</div>
        <div class="song-subtitle" id="statusText">آرون افشار • لمس برای پخش</div>
      </div>
      <div class="disk" id="disk">
        <span>🎵</span>
      </div>
    </div>
  </div>

  <!-- فایل صوتی جانم باش از آرون افشار -->
  <audio id="audio" loop preload="auto">
    <source src="https://dls.music-fa.com/tagdl/downloads/Aron%20Afshar%20-%20Janam%20Bash%20(128).mp3" type="audio/mpeg">
    <source src="https://dl.musicdel.ir/Music/1400/01/aron_afshar_janam_bash%20128.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const disk = document.getElementById('disk');
    const statusText = document.getElementById('statusText');

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          disk.classList.add('playing');
          statusText.innerText = "در حال پخش...";
        }).catch((err) => {
          console.log(err);
          statusText.innerText = "دوباره لمس کنید";
        });
      } else {
        audio.pause();
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        disk.classList.remove('playing');
        statusText.innerText = "آرون افشار • متوقف شد";
      }
    }

    function createHearts() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      const symbols = ['❤️', '💖', '✨', '🌸', '💕'];
      heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      heart.style.left = Math.random() * 95 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
      heart.style.fontSize = (Math.random() * 14 + 14) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(),
